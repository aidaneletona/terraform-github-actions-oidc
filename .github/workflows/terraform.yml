name: Terraform CI/CD

on:
  pull_request:
    branches:
      - main

  push:
    branches:
      - main

  schedule:
    - cron: "0 15 * * *"

  workflow_dispatch:
    inputs:
      action:
        description: "Action"
        required: true
        type: choice
        options:
          - plan-dev
          - apply-dev
          - promote-prod

permissions:
  id-token: write
  contents: read
  actions: read
  pull-requests: read

jobs:

  changes:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    outputs:
      dev: ${{ steps.filter.outputs.dev }}
      prod: ${{ steps.filter.outputs.prod }}
      modules: ${{ steps.filter.outputs.modules }}
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check changed files
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            dev:
              - 'terraform/environments/dev/**'
            prod:
              - 'terraform/environments/prod/**'
            modules:
              - 'terraform/modules/**'

  pr-check:
      if: github.event_name == 'pull_request'
      runs-on: ubuntu-latest

      defaults:
        run:
          working-directory: terraform/environments/dev

      steps:
        - name: Checkout repository
          uses: actions/checkout@v4
          with:
            fetch-depth: 0

        - name: Detect PROD changes
          id: prod_changes
          working-directory: ${{ github.workspace }}
          shell: bash
          run: |
            CHANGED_FILES=$(git diff --name-only "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}")

            echo "Files changed in this pull request:"
            echo "$CHANGED_FILES"

            if echo "$CHANGED_FILES" | grep -q '^terraform/environments/prod/'; then
              echo "changed=true" >> "$GITHUB_OUTPUT"
            else
              echo "changed=false" >> "$GITHUB_OUTPUT"
            fi

        - name: Setup Terraform
          uses: hashicorp/setup-terraform@v3

        - name: Configure Plan Role
          uses: aws-actions/configure-aws-credentials@v6
          with:
            role-to-assume: arn:aws:iam::523109312572:role/GitHubActionsTerraformPlanRole
            aws-region: us-east-2

        - name: Terraform Format Check
          run: terraform fmt -check -recursive

        - name: Terraform Init
          run: terraform init

        - name: Terraform Validate
          run: terraform validate

        - name: Checkov Security Scan
          uses: bridgecrewio/checkov-action@v12
          with:
            directory: terraform/environments/dev
            framework: terraform

        - name: Terraform Plan
          run: terraform plan 

        - name: Terraform Init PROD
          if: steps.prod_changes.outputs.changed == 'true'
          working-directory: terraform/environments/prod
          run: terraform init

        - name: Terraform Validate PROD
          if: steps.prod_changes.outputs.changed == 'true'
          working-directory: terraform/environments/prod
          run: terraform validate

        - name: Checkov Security Scan PROD
          if: steps.prod_changes.outputs.changed == 'true'
          uses: bridgecrewio/checkov-action@v12
          with:
            directory: terraform/environments/prod
            framework: terraform

        - name: Terraform Plan PROD
          if: steps.prod_changes.outputs.changed == 'true'
          working-directory: terraform/environments/prod
          run: terraform plan


    # DEV
  dev:
    needs: changes

    if: |
      always() &&
      (
        (github.event_name == 'push' &&
          (needs.changes.outputs.dev == 'true' ||
          needs.changes.outputs.modules == 'true')) ||
        (github.event_name == 'workflow_dispatch' &&
          (inputs.action == 'plan-dev' ||
          inputs.action == 'apply-dev')) ||
        github.event_name == 'schedule'
      )

    environment: dev
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: terraform/environments/dev

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Configure Plan Role
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::523109312572:role/GitHubActionsTerraformPlanRole
          aws-region: us-east-2

      - name: Terraform Format Check
        run: terraform fmt -check -recursive

      - name: Terraform Init
        run: terraform init

      - name: Terraform Validate
        run: terraform validate

      - name: Checkov Security Scan
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: terraform/environments/dev
          framework: terraform

      - name: Terraform Plan
        id: plan
        shell: bash
        run: |
          set +e

          terraform plan -detailed-exitcode -out=tfplan

          EXIT_CODE=$?
          echo "exit_code=$EXIT_CODE" >> "$GITHUB_OUTPUT"

          if [ "$EXIT_CODE" -eq 0 ]; then
            echo "No changes detected."
            exit 0
          elif [ "$EXIT_CODE" -eq 2 ]; then
            echo "Changes detected."
            exit 0
          else
            echo "Terraform plan failed."
            exit 1
          fi

      - name: Report Plan Changes
        run: |
          if [ "${{ steps.plan.outputs.exit_code }}" -eq 2 ]; then
            echo "Changes detected."
          elif [ "${{ steps.plan.outputs.exit_code }}" -eq 0 ]; then
            echo "No changes detected."
          fi

      - name: Drift Summary
        if: github.event_name == 'schedule'
        run: |
          if [ "${{ steps.plan.outputs.exit_code }}" -eq 2 ]; then
            echo "## DEV Drift Detection" >> "$GITHUB_STEP_SUMMARY"
            echo "Drift detected in DEV." >> "$GITHUB_STEP_SUMMARY"
          elif [ "${{ steps.plan.outputs.exit_code }}" -eq 0 ]; then
            echo "## DEV Drift Detection" >> "$GITHUB_STEP_SUMMARY"
            echo "No drift detected in DEV." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Configure Apply Role
        if: |
          steps.plan.outputs.exit_code == '2' &&
          (
            github.event_name == 'push' ||
            (github.event_name == 'workflow_dispatch' &&
            inputs.action == 'apply-dev')
          )

        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::523109312572:role/GitHubActionsTerraformApplyRole
          aws-region: us-east-2

      - name: Terraform Apply
        if: |
          steps.plan.outputs.exit_code == '2' &&
          (
            github.event_name == 'push' ||
            (github.event_name == 'workflow_dispatch' &&
            inputs.action == 'apply-dev')
          )
        run: terraform apply -auto-approve tfplan


    # PROD
  prod:
    if: |
      (github.event_name == 'workflow_dispatch' &&
      inputs.action == 'promote-prod') ||
      github.event_name == 'schedule'

    environment: prod
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: terraform/environments/prod

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Verify PROD Promotion Eligibility
      if: |
        github.event_name == 'workflow_dispatch' &&
        inputs.action == 'promote-prod'
      working-directory: ${{ github.workspace }}
      env:
        GH_TOKEN: ${{ github.token }}
      shell: bash
      run: |
        set -e

        SHA="${{ github.sha }}"

        PR_NUMBER=$(gh api \
          "repos/${{ github.repository }}/commits/$SHA/pulls" \
          --jq '[.[] | select(.merged_at != null and .base.ref == "main")][0].number // empty')

        if [ -z "$PR_NUMBER" ]; then
          echo "ERROR: No merged PR into main found."
          exit 1
        fi

        CHANGED_FILES=$(gh api \
          --paginate \
          "repos/${{ github.repository }}/pulls/$PR_NUMBER/files" \
          --jq '.[].filename')

        # Shared module change → DEV must have succeeded.
        if echo "$CHANGED_FILES" | grep -q '^terraform/modules/'; then

          RUN_ID=$(gh api \
            "repos/${{ github.repository }}/actions/runs?head_sha=$SHA&event=push" \
            --jq '.workflow_runs[] | select(.name == "Terraform CI/CD") | .id' \
            | head -n 1)

          if [ -z "$RUN_ID" ]; then
            echo "ERROR: No DEV workflow run found."
            exit 1
          fi

          DEV_SUCCESS=$(gh api \
            "repos/${{ github.repository }}/actions/runs/$RUN_ID/jobs" \
            --jq '[.jobs[] | select(.name == "dev" and .conclusion == "success")] | length')

          if [ "$DEV_SUCCESS" -eq 0 ]; then
            echo "ERROR: Shared change did not successfully pass DEV."
            exit 1
          fi

          echo "Shared change passed DEV. PROD promotion allowed."
          exit 0
        fi

        # PROD-specific change → it already passed the PROD PR checks.
        if echo "$CHANGED_FILES" | grep -q '^terraform/environments/prod/'; then
          echo "PROD-specific change passed the PR path. PROD promotion allowed."
          exit 0
        fi

        echo "ERROR: No PROD-eligible change found."
        exit 1

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3

    - name: Configure Plan Role
      uses: aws-actions/configure-aws-credentials@v6
      with:
        role-to-assume: arn:aws:iam::523109312572:role/GitHubActionsTerraformPlanRole
        aws-region: us-east-2

    - name: Terraform Format Check
      run: terraform fmt -check -recursive

    - name: Terraform Init
      run: terraform init

    - name: Terraform Validate
      run: terraform validate

    - name: Checkov Security Scan
      uses: bridgecrewio/checkov-action@v12
      with:
        directory: terraform/environments/prod
        framework: terraform

    - name: Terraform Plan
      id: plan
      shell: bash
      run: |
        set +e

        terraform plan -detailed-exitcode -out=tfplan

        EXIT_CODE=$?
        echo "exit_code=$EXIT_CODE" >> "$GITHUB_OUTPUT"

        if [ "$EXIT_CODE" -eq 0 ]; then
          echo "No changes detected."
          exit 0
        elif [ "$EXIT_CODE" -eq 2 ]; then
          echo "Changes detected."
          exit 0
        else
          echo "Terraform plan failed."
          exit 1
        fi

    - name: Report Plan Changes
      run: |
        if [ "${{ steps.plan.outputs.exit_code }}" -eq 2 ]; then
          echo "Changes detected."
        elif [ "${{ steps.plan.outputs.exit_code }}" -eq 0 ]; then
          echo "No changes detected."
        fi

    - name: Drift Summary
      if: github.event_name == 'schedule'
      run: |
        if [ "${{ steps.plan.outputs.exit_code }}" -eq 2 ]; then
          echo "## PROD Drift Detection" >> "$GITHUB_STEP_SUMMARY"
          echo "Drift detected in PROD." >> "$GITHUB_STEP_SUMMARY"
        elif [ "${{ steps.plan.outputs.exit_code }}" -eq 0 ]; then
          echo "## PROD Drift Detection" >> "$GITHUB_STEP_SUMMARY"
          echo "No drift detected in PROD." >> "$GITHUB_STEP_SUMMARY"
        fi

    - name: Configure Apply Role
      if: |
        steps.plan.outputs.exit_code == '2' &&
        github.event_name == 'workflow_dispatch' &&
        inputs.action == 'promote-prod'
      
      uses: aws-actions/configure-aws-credentials@v6
      with:
        role-to-assume: arn:aws:iam::523109312572:role/GitHubActionsTerraformApplyRole
        aws-region: us-east-2

    - name: Terraform Apply
      if: |
        steps.plan.outputs.exit_code == '2' &&
        github.event_name == 'workflow_dispatch' &&
        inputs.action == 'promote-prod'
        
      run: terraform apply -auto-approve tfplan

