name: Terraform CI/CD

on:
  pull_request:
    branches:
      - main

  push:
    branches:
      - main

  schedule:
    - cron: "0 15 * * *"

  workflow_dispatch:
    inputs:
      environment:
        description: "Environment"
        required: true
        type: choice
        options:
          - dev
          - prod
      action:
        description: "Action"
        required: true
        type: choice
        options:
          - plan
          - apply

permissions:
  id-token: write
  contents: read

jobs:

  # Find out whether dev or prod files changed
  changes:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    outputs:
      dev_changed: ${{ steps.filter.outputs.dev }}
      prod_changed: ${{ steps.filter.outputs.prod }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check changed files
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            dev:
              - 'terraform/environments/dev/**'
              - 'terraform/modules/**'
            prod:
              - 'terraform/environments/prod/**'
              - 'terraform/modules/**'
  # DEV
  dev:
    needs: changes
    if: | 
      always() &&
      (
        github.event_name == 'pull_request' ||
        (github.event_name == 'workflow_dispatch' && inputs.environment == 'dev') ||
        (github.event_name == 'push' && needs.changes.outputs.dev_changed == 'true') ||
        (github.event_name == 'schedule')
      )

        
    environment: dev
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform/environments/dev

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Configure Plan Role
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::523109312572:role/GitHubActionsTerraformPlanRole
          aws-region: us-east-2

      - name: Terraform Format Check
        run: terraform fmt -check -recursive

      - name: Terraform Init
        run: terraform init

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        id: plan
        shell: bash
        run: |
          set +e

          terraform plan -detailed-exitcode -out=tfplan
          EXIT_CODE=$?

          echo "exit_code=$EXIT_CODE" >> "$GITHUB_OUTPUT"

          if [ "$EXIT_CODE" -eq 0 ]; then
            echo "No changes detected."
            exit 0
          elif [ "$EXIT_CODE" -eq 2 ]; then
            echo "Changes detected."
            exit 0
          else
            echo "Terraform plan failed."
            exit 1
          fi

      - name: Report Plan Changes
        run: |
          if [ "${{ steps.plan.outputs.exit_code }}" -eq 2 ]; then
            echo "Changes detected."
          elif [ "${{ steps.plan.outputs.exit_code }}" -eq 0 ]; then
            echo "No changes detected."
          fi

      - name: Drift Summary
        if: github.event_name == 'schedule'
        run: |
          if [ "${{ steps.plan.outputs.exit_code }}" -eq 2 ]; then
            echo "## DEV Drift Detection" >> "$GITHUB_STEP_SUMMARY"
            echo "Drift detected in DEV." >> "$GITHUB_STEP_SUMMARY"
          elif [ "${{ steps.plan.outputs.exit_code }}" -eq 0 ]; then
            echo "## DEV Drift Detection" >> "$GITHUB_STEP_SUMMARY"
            echo "No drift detected in DEV." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Configure Apply Role
        if: |
          github.event_name == 'push' ||
          (github.event_name == 'workflow_dispatch' && inputs.action == 'apply')
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::523109312572:role/GitHubActionsTerraformApplyRole
          aws-region: us-east-2     

      - name: Terraform Apply
        if: |
          github.event_name == 'push' ||
          (github.event_name == 'workflow_dispatch' && inputs.action == 'apply')
        run: terraform apply -auto-approve tfplan


  # PROD
  prod:
    needs: changes
    if: |
      always() &&
      (
        (github.event_name == 'workflow_dispatch' && inputs.environment == 'prod') ||
        (github.event_name == 'push' && needs.changes.outputs.prod_changed == 'true') ||
        (github.event_name == 'schedule') 
      )
    
    environment: prod
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: terraform/environments/prod

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Configure Plan Role
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::523109312572:role/GitHubActionsTerraformPlanRole
          aws-region: us-east-2

      - name: Terraform Format Check
        run: terraform fmt -check -recursive

      - name: Terraform Init
        run: terraform init

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        id: plan
        shell: bash
        run: |
          set +e

          terraform plan -detailed-exitcode -out=tfplan
          EXIT_CODE=$?

          echo "exit_code=$EXIT_CODE" >> "$GITHUB_OUTPUT"

          if [ "$EXIT_CODE" -eq 0 ]; then
            echo "No changes detected."
            exit 0
          elif [ "$EXIT_CODE" -eq 2 ]; then
            echo "Changes detected."
            exit 0
          else
            echo "Terraform plan failed."
            exit 1
          fi

      - name: Report Plan Changes
        run: |
          if [ "${{ steps.plan.outputs.exit_code }}" -eq 2 ]; then
            echo "Changes detected."
          elif [ "${{ steps.plan.outputs.exit_code }}" -eq 0 ]; then
            echo "No changes detected."
          fi

      - name: Drift Summary
        if: github.event_name == 'schedule'
        run: |
          if [ "${{ steps.plan.outputs.exit_code }}" -eq 2 ]; then
            echo "## PROD Drift Detection" >> "$GITHUB_STEP_SUMMARY"
            echo "Drift detected in PROD." >> "$GITHUB_STEP_SUMMARY"
          elif [ "${{ steps.plan.outputs.exit_code }}" -eq 0 ]; then
            echo "## PROD Drift Detection" >> "$GITHUB_STEP_SUMMARY"
            echo "No drift detected in PROD." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Configure Apply Role
        if: |
          github.event_name == 'push' ||
          (github.event_name == 'workflow_dispatch' && inputs.action == 'apply')
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::523109312572:role/GitHubActionsTerraformApplyRole
          aws-region: us-east-2

      - name: Terraform Apply
        if: |
          github.event_name == 'push' ||
          (github.event_name == 'workflow_dispatch' && inputs.action == 'apply')
        run: terraform apply -auto-approve tfplan

