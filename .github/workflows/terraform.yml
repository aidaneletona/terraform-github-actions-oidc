name: Terraform CI/CD

on:
  pull_request:
    branches:
      - main

  push:
    branches:
      - main

  schedule:
    - cron: "0 15 * * *"

  workflow_dispatch:
    inputs:
      action:
        description: "Action"
        required: true
        type: choice
        options:
          - plan-dev
          - apply-dev

permissions:
  id-token: write
  contents: read

jobs:

  changes:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    outputs:
      dev: ${{ steps.filter.outputs.dev }}
      prod: ${{ steps.filter.outputs.prod }}
      modules: ${{ steps.filter.outputs.modules }}
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check changed files
        uses: dorny/paths-filter@v3
        id: filter
        with:
          list-files: shell
          filters: |
            all:
              - '**'
            dev:
              - 'terraform/environments/dev/**'
            prod:
              - 'terraform/environments/prod/**'
            modules:
              - 'terraform/modules/**'

      - name: Print changed files
        shell: bash
        run: |
          echo "All files changed in this push:"
          echo "${{ steps.filter.outputs.all_files }}"

          echo "Terraform routing:"
          echo "DEV=${{ steps.filter.outputs.dev }}"
          echo "PROD=${{ steps.filter.outputs.prod }}"
          echo "MODULES=${{ steps.filter.outputs.modules }}"

  pr-check:

    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: terraform/environments/dev

    steps:

    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Detect Terraform changes
      id: terraform_changes
      uses: dorny/paths-filter@v3
      with:
        list-files: shell
        filters: |
          all:
            - '**'
          dev:
            - 'terraform/environments/dev/**'
          prod:
            - 'terraform/environments/prod/**'
          modules:
            - 'terraform/modules/**'

    - name: Print changed files
      shell: bash
      run: |
        echo "All files changed in this pull request:"
        echo "${{ steps.terraform_changes.outputs.all_files }}"

        echo "Terraform routing:"
        echo "DEV=${{ steps.terraform_changes.outputs.dev }}"
        echo "PROD=${{ steps.terraform_changes.outputs.prod }}"
        echo "MODULES=${{ steps.terraform_changes.outputs.modules }}"

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3

    - name: Configure Plan Role
      uses: aws-actions/configure-aws-credentials@v6
      with:
        role-to-assume: arn:aws:iam::523109312572:role/GitHubActionsTerraformPlanRole
        aws-region: us-east-2

    - name: Terraform Format Check DEV
      if: |
        steps.terraform_changes.outputs.dev == 'true' ||
        steps.terraform_changes.outputs.modules == 'true'
      run: terraform fmt -check -recursive

    - name: Terraform Init DEV
      if: |
        steps.terraform_changes.outputs.dev == 'true' ||
        steps.terraform_changes.outputs.modules == 'true'
      run: terraform init

    - name: Terraform Validate DEV
      if: |
        steps.terraform_changes.outputs.dev == 'true' ||
        steps.terraform_changes.outputs.modules == 'true'
      run: terraform validate

    - name: Checkov Security Scan DEV
      if: |
        steps.terraform_changes.outputs.dev == 'true' ||
        steps.terraform_changes.outputs.modules == 'true'
      uses: bridgecrewio/checkov-action@v12
      with:
        directory: terraform/environments/dev
        framework: terraform

    - name: Terraform Plan DEV
      if: |
        steps.terraform_changes.outputs.dev == 'true' ||
        steps.terraform_changes.outputs.modules == 'true'
      run: terraform plan

    - name: Terraform Format Check PROD
      if: |
        steps.terraform_changes.outputs.prod == 'true' ||
        steps.terraform_changes.outputs.modules == 'true'
      working-directory: terraform/environments/prod
      run: terraform fmt -check -recursive

    - name: Terraform Init PROD
      if: |
        steps.terraform_changes.outputs.prod == 'true' ||
        steps.terraform_changes.outputs.modules == 'true'
      working-directory: terraform/environments/prod
      run: terraform init

    - name: Terraform Validate PROD
      if: |
        steps.terraform_changes.outputs.prod == 'true' ||
        steps.terraform_changes.outputs.modules == 'true'
      working-directory: terraform/environments/prod
      run: terraform validate

    - name: Checkov Security Scan PROD
      if: |
        steps.terraform_changes.outputs.prod == 'true' ||
        steps.terraform_changes.outputs.modules == 'true'
      uses: bridgecrewio/checkov-action@v12
      with:
        directory: terraform/environments/prod
        framework: terraform

    - name: Terraform Plan PROD
      if: |
        steps.terraform_changes.outputs.prod == 'true' ||
        steps.terraform_changes.outputs.modules == 'true'
      working-directory: terraform/environments/prod
      run: terraform plan

    - name: Terraform Format Check MODULES
      if: steps.terraform_changes.outputs.modules == 'true'
      working-directory: terraform/modules
      run: terraform fmt -check -recursive

    - name: Checkov Security Scan MODULES
      if: steps.terraform_changes.outputs.modules == 'true'
      uses: bridgecrewio/checkov-action@v12
      with:
        directory: terraform/modules
        framework: terraform


    # DEV
  dev:
    needs: changes

    if: |
      always() &&
      (
        (github.event_name == 'push' &&
          (needs.changes.outputs.dev == 'true' ||
          needs.changes.outputs.modules == 'true')) ||
        (github.event_name == 'workflow_dispatch' &&
          (inputs.action == 'plan-dev' ||
          inputs.action == 'apply-dev'))
      )

    environment: dev
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: terraform/environments/dev

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Configure Plan Role
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::523109312572:role/GitHubActionsTerraformPlanRole
          aws-region: us-east-2

      - name: Terraform Format Check
        run: terraform fmt -check -recursive

      - name: Terraform Init
        run: terraform init

      - name: Terraform Validate
        run: terraform validate

      - name: Checkov Security Scan
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: terraform/environments/dev
          framework: terraform

      - name: Terraform Plan
        id: plan
        shell: bash
        run: |
          set +e

          terraform plan -detailed-exitcode -out=tfplan

          EXIT_CODE=$?
          echo "exit_code=$EXIT_CODE" >> "$GITHUB_OUTPUT"

          if [ "$EXIT_CODE" -eq 0 ]; then
            echo "No changes detected."
            exit 0
          elif [ "$EXIT_CODE" -eq 2 ]; then
            echo "Changes detected."
            exit 0
          else
            echo "Terraform plan failed."
            exit 1
          fi

      - name: Configure Apply Role
        if: |
          steps.plan.outputs.exit_code == '2' &&
          (
            github.event_name == 'push' ||
            (github.event_name == 'workflow_dispatch' &&
            inputs.action == 'apply-dev')
          )

        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::523109312572:role/GitHubActionsTerraformApplyRole
          aws-region: us-east-2

      - name: Terraform Apply
        if: |
          steps.plan.outputs.exit_code == '2' &&
          (
            github.event_name == 'push' ||
            (github.event_name == 'workflow_dispatch' &&
            inputs.action == 'apply-dev')
          )
        run: terraform apply -auto-approve tfplan


    # PROD
  prod:
    needs:
      - changes
      - dev
    if: |
      always() &&
      (
        (
          github.event_name == 'push' &&
          (
            needs.changes.outputs.modules == 'true' ||
            needs.changes.outputs.prod == 'true'
          ) &&
          (
            needs.changes.outputs.modules != 'true' ||
            needs.dev.result == 'success'
          )
        ) 
      )

    environment: prod
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: terraform/environments/prod

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3

    - name: Configure Plan Role
      uses: aws-actions/configure-aws-credentials@v6
      with:
        role-to-assume: arn:aws:iam::523109312572:role/GitHubActionsTerraformPlanRole
        aws-region: us-east-2

    - name: Terraform Format Check
      run: terraform fmt -check -recursive

    - name: Terraform Init
      run: terraform init

    - name: Terraform Validate
      run: terraform validate

    - name: Checkov Security Scan
      uses: bridgecrewio/checkov-action@v12
      with:
        directory: terraform/environments/prod
        framework: terraform

    - name: Terraform Plan
      id: plan
      shell: bash
      run: |
        set +e

        terraform plan -detailed-exitcode -out=tfplan

        EXIT_CODE=$?
        echo "exit_code=$EXIT_CODE" >> "$GITHUB_OUTPUT"

        if [ "$EXIT_CODE" -eq 0 ]; then
          echo "No changes detected."
          exit 0
        elif [ "$EXIT_CODE" -eq 2 ]; then
          echo "Changes detected."
          exit 0
        else
          echo "Terraform plan failed."
          exit 1
        fi

    - name: Configure Apply Role
      if: |
        steps.plan.outputs.exit_code == '2' &&
        github.event_name == 'push'
      
      uses: aws-actions/configure-aws-credentials@v6
      with:
        role-to-assume: arn:aws:iam::523109312572:role/GitHubActionsTerraformApplyRole
        aws-region: us-east-2

    - name: Terraform Apply
      if: |
        steps.plan.outputs.exit_code == '2' &&
        github.event_name == 'push'
        
      run: terraform apply -auto-approve tfplan


  dev-drift:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: terraform/environments/dev

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Configure Plan Role
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::523109312572:role/GitHubActionsTerraformPlanRole
          aws-region: us-east-2

      - name: Terraform Init
        run: terraform init

      - name: Terraform Plan
        id: plan
        shell: bash
        run: |
          set +e
          terraform plan -detailed-exitcode
          EXIT_CODE=$?
          echo "exit_code=$EXIT_CODE" >> "$GITHUB_OUTPUT"

          if [ "$EXIT_CODE" -eq 0 ]; then
            echo "No DEV drift detected."
            exit 0
          elif [ "$EXIT_CODE" -eq 2 ]; then
            echo "DEV drift detected."
            exit 0
          else
            echo "DEV Terraform plan failed."
            exit 1
          fi

      - name: DEV Drift Summary
        if: always()
        run: |
          echo "## DEV Drift Detection" >> "$GITHUB_STEP_SUMMARY"

          if [ "${{ steps.plan.outputs.exit_code }}" = "2" ]; then
            echo "Drift detected in DEV." >> "$GITHUB_STEP_SUMMARY"
          elif [ "${{ steps.plan.outputs.exit_code }}" = "0" ]; then
            echo "No drift detected in DEV." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "DEV drift check failed." >> "$GITHUB_STEP_SUMMARY"
          fi

        


  prod-drift:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: terraform/environments/prod

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Configure Plan Role
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::523109312572:role/GitHubActionsTerraformPlanRole
          aws-region: us-east-2

      - name: Terraform Init
        run: terraform init

      - name: Terraform Plan
        id: plan
        shell: bash
        run: |
          set +e
          terraform plan -detailed-exitcode
          EXIT_CODE=$?
          echo "exit_code=$EXIT_CODE" >> "$GITHUB_OUTPUT"

          if [ "$EXIT_CODE" -eq 0 ]; then
            echo "No PROD drift detected."
            exit 0
          elif [ "$EXIT_CODE" -eq 2 ]; then
            echo "PROD drift detected."
            exit 0
          else
            echo "PROD Terraform plan failed."
            exit 1
          fi

      - name: PROD Drift Summary
        if: always()
        run: |
          echo "## PROD Drift Detection" >> "$GITHUB_STEP_SUMMARY"

          if [ "${{ steps.plan.outputs.exit_code }}" = "2" ]; then
            echo "Drift detected in PROD." >> "$GITHUB_STEP_SUMMARY"
          elif [ "${{ steps.plan.outputs.exit_code }}" = "0" ]; then
            echo "No drift detected in PROD." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "PROD drift check failed." >> "$GITHUB_STEP_SUMMARY"
          fi

